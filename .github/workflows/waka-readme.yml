name: Update WakaTime stats

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Refresh README coding activity
    runs-on: ubuntu-latest
    steps:
      - name: Update WakaTime section
        uses: athul/waka-readme@8539bedb8277066fc9fe1b47d1f9b108eb866494 # v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_RANGE: last_7_days
          LANG_COUNT: "6"
          SHOW_TITLE: "true"
          SHOW_TOTAL: "true"
          CODE_LANG: text
          COMMIT_MESSAGE: "chore: update WakaTime stats"
